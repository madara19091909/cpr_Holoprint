name: cpr_holoprint
description: CPR Holoprint - mobile workspace for Minecraft Bedrock hologram packs.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  file_picker: ^13.3.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
