name: Build CPR Holoprint APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/build-apk.yml'
      - 'tool/**'

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when missing
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org com.cpr --project-name holoprint --no-pub /tmp/cpr-android-seed
            cp -R /tmp/cpr-android-seed/android ./android
          fi

      - name: Ensure Android internet permission and app label
        run: python3 tool/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins for new R8 / AGP (proguard-android-optimize)
        run: python3 tool/patch_plugins.py

      - name: Format Dart source
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cpr-holoprint-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
